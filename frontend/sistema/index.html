<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TecnoTaller</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Estilos personalizados adicionales */
        .bg-automotive {
            background:
                linear-gradient(135deg, rgba(0, 0, 0, 0.8) 0%, rgba(17, 24, 39, 0.9) 50%, rgba(31, 41, 55, 0.8) 100%),
                url('https://academiacastrol.com/wp-content/uploads/2024/10/Organizacion-de-taller-automotriz.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .glass-effect {
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .logo-circle {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
        }

        .btn-login {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
        }
    </style>
</head>

<body class="min-h-screen bg-automotive flex items-center justify-center p-4">
    <!-- Background Pattern -->
    <div class="absolute inset-0 bg-black opacity-20"></div>

    <!-- Login Container -->
    <div class="w-full max-w-md relative z-10">
        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <div class="logo-circle inline-flex items-center justify-center w-20 h-20 rounded-full shadow-lg mb-4">
                <i class="fas fa-wrench text-3xl text-white"></i>
            </div>
            <h1 class="text-4xl font-bold text-white mb-2 drop-shadow-lg">TecnoTaller</h1>
            <p class="text-gray-200 text-lg drop-shadow">Sistema de Gestión Automotriz</p>
        </div>

        <!-- Login Form -->
        <div class="glass-effect rounded-2xl shadow-2xl p-8">
            <form id="loginForm" class="space-y-6">
                <!-- Email/Usuario -->
                <div class="space-y-2">
                    <label for="email" class="block text-sm font-medium text-white">
                        <i class="fas fa-user mr-2"></i>Usuario o Email
                    </label>
                    <input type="text" id="email" name="email" required
                        class="w-full px-4 py-3 bg-black/30 border border-gray-600 rounded-lg text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all duration-200"
                        placeholder="Ingresa tu usuario o email">
                </div>

                <!-- Password -->
                <div class="space-y-2">
                    <label for="password" class="block text-sm font-medium text-white">
                        <i class="fas fa-lock mr-2"></i>Contraseña
                    </label>
                    <div class="relative">
                        <input type="password" id="password" name="password" required
                            class="w-full px-4 py-3 bg-black/30 border border-gray-600 rounded-lg text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all duration-200 pr-12"
                            placeholder="Ingresa tu contraseña">
                        <buttonbutton type="button" id="togglePassword" title="Mostrar u ocultar contraseña"
                            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-white transition-colors">
                            <i class="fas fa-eye" id="eyeIcon"></i>
                            </button>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center text-gray-200">
                        <input type="checkbox" id="remember"
                            class="mr-2 rounded border-gray-600 bg-black/30 text-amber-500 focus:ring-amber-500">
                        Recordarme
                    </label>
                    <a href="#" class="text-amber-400 hover:text-amber-300 transition-colors">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>

                <!-- Login Button -->
                <button type="submit" id="loginBtn"
                    class="btn-login w-full font-semibold py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500 transition-all duration-200 transform hover:scale-105">
                    <span id="loginBtnText">
                        <i class="fas fa-sign-in-alt mr-2"></i>Iniciar Sesión
                    </span>
                    <span id="loginSpinner" class="hidden">
                        <i class="fas fa-spinner fa-spin mr-2"></i>Iniciando sesión...
                    </span>
                </button>
            </form>

            <!-- Error/Success Messages -->
            <div id="messageContainer" class="mt-4 hidden">
                <div id="errorMessage"
                    class="bg-red-500/20 border border-red-500/50 text-red-100 px-4 py-3 rounded-lg hidden">
                    <i class="fas fa-exclamation-triangle mr-2"></i>
                    <span id="errorText"></span>
                </div>
                <div id="successMessage"
                    class="bg-green-500/20 border border-green-500/50 text-green-100 px-4 py-3 rounded-lg hidden">
                    <i class="fas fa-check-circle mr-2"></i>
                    <span id="successText"></span>
                </div>
            </div>
        </div>

        <!-- Developers Info -->
        <div class="mt-6 text-center">
            <div class="text-gray-400 text-xs space-y-1">
                <p class="font-medium">Desarrollado por:</p>
                <p>Cristobal Prados • Carlos Gonzalez</p>
                <p class="text-gray-500">Ingeniería en Informática • Facultad de Informática, Electrónica y Comunicación
                </p>
                <p class="text-gray-500">Universidad de Panamá • 2025</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-4 text-gray-500 text-xs">
            <p>&copy; 2025 TecnoTaller. Todos los derechos reservados.</p>
        </div>
    </div>

    <script src="../js/modulos/index.js"></script>
</body>

</html>
