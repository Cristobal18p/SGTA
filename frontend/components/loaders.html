<style>
    /* Animaciones básicas */
    @keyframes spin {
        from {
            transform: rotate(0deg);
        }

        to {
            transform: rotate(360deg);
        }
    }

    @keyframes bounce {

        0%,
        80%,
        100% {
            transform: scale(0);
            opacity: 0.5;
        }

        40% {
            transform: scale(1);
            opacity: 1;
        }
    }

    @keyframes wave {

        0%,
        40%,
        100% {
            transform: scaleY(0.4);
            opacity: 0.5;
        }

        20% {
            transform: scaleY(1);
            opacity: 1;
        }
    }

    @keyframes progress {
        0% {
            width: 0%;
        }

        100% {
            width: 100%;
        }
    }

    @keyframes pulse {

        0%,
        100% {
            opacity: 1;
            transform: scale(1);
        }

        50% {
            opacity: 0.5;
            transform: scale(1.05);
        }
    }

    @keyframes shimmer {
        0% {
            background-position: -468px 0;
        }

        100% {
            background-position: 468px 0;
        }
    }

    /* Clases de animación */
    .animate-spin {
        animation: spin 1s linear infinite;
    }

    .animate-bounce {
        animation: bounce 1.5s ease-in-out infinite;
    }

    .animate-wave {
        animation: wave 1.2s ease-in-out infinite;
    }

    .animate-progress {
        animation: progress 3s ease-in-out infinite;
    }

    .animate-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    /* Skeleton loaders */
    .skeleton-line,
    .skeleton-avatar {
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
    }

    /* Spinner personalizado */
    .spinner-circle {
        border-color: rgb(229, 231, 235);
        border-top-color: rgb(245, 158, 11);
    }

    /* Dots loader */
    .dot {
        animation-duration: 1.4s;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
    }

    /* Wave loader */
    .wave-bar {
        animation-duration: 1.2s;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
    }

    /* Progress bar */
    .progress-bar {
        transition: width 0.3s ease;
    }

    /* Button states */
    .btn-primary {
        background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
    }

    .btn-primary:hover:not(:disabled) {
        background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
        box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
        transform: translateY(-1px);
    }

    .btn-primary:disabled {
        background: linear-gradient(135deg, #9ca3af 0%, #6b7280 100%);
        box-shadow: none;
        transform: none;
    }

    .btn-success {
        background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }

    /* Overlay loader */
    .loader.overlay {
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
    }

    /* Loading text animations */
    .loading-text::after {
        content: '';
        animation: loadingDots 2s infinite;
    }

    @keyframes loadingDots {

        0%,
        20% {
            content: '.';
        }

        40% {
            content: '..';
        }

        60%,
        100% {
            content: '...';
        }
    }

    /* Responsive adjustments */
    @media (max-width: 640px) {
        .loader.overlay .spinner-circle {
            width: 3rem;
            height: 3rem;
        }

        .loader.overlay h3 {
            font-size: 1rem;
        }

        .loader.overlay p {
            font-size: 0.875rem;
        }
    }

    /* Dark mode support */
    @media (prefers-color-scheme: dark) {

        .skeleton-line,
        .skeleton-avatar {
            background: linear-gradient(90deg, #374151 25%, #4b5563 50%, #374151 75%);
        }

        .loader.overlay {
            background-color: rgba(17, 24, 39, 0.9);
            color: rgb(243, 244, 246);
        }
    }

    /* Micro-interactions */
    .loader:not(.hidden) {
        animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }

    /* Loading state transitions */
    .loading-transition {
        transition: all 0.3s ease;
    }

    .loading-transition.is-loading {
        opacity: 0.7;
        pointer-events: none;
        filter: blur(1px);
    }
</style>

<script>
    // LOADERS API
    class LoadersAPI {
        constructor() {
            this.activeLoaders = new Set();
            this.defaultOptions = {
                type: 'spinner',
                text: 'Cargando...',
                overlay: false,
                progress: false,
                duration: 0 // 0 = manual dismiss
            };

            this.initializeFullscreenLoader();
        }

        // Inicializar loader de pantalla completa
        initializeFullscreenLoader() {
            this.fullscreenLoader = document.getElementById('fullscreenLoader');
            this.fullscreenProgress = document.getElementById('fullscreenProgress');
            this.fullscreenPercentage = document.getElementById('fullscreenPercentage');
        }

        // Mostrar loader
        show(target, options = {}) {
            const config = { ...this.defaultOptions, ...options };

            if (typeof target === 'string') {
                target = document.querySelector(target);
            }

            if (!target) {
                console.warn('LoadersAPI: Target element not found');
                return null;
            }

            const loaderId = this.generateId();
            const loader = this.createLoader(config, loaderId);

            if (config.overlay) {
                this.showOverlayLoader(target, loader, config);
            } else {
                this.showInlineLoader(target, loader, config);
            }

            this.activeLoaders.add(loaderId);

            // Auto-dismiss si se especifica duración
            if (config.duration > 0) {
                setTimeout(() => {
                    this.hide(loaderId);
                }, config.duration);
            }

            return loaderId;
        }

        // Crear loader
        createLoader(config, id) {
            const loader = document.createElement('div');
            loader.className = 'loader';
            loader.dataset.loaderId = id;

            let content = '';

            switch (config.type) {
                case 'spinner':
                    content = `
                    <div class="flex flex-col items-center justify-center space-y-3">
                        <div class="spinner-circle w-8 h-8 border-4 border-gray-300 border-t-amber-500 rounded-full animate-spin"></div>
                        ${config.text ? `<div class="text-gray-600 text-sm font-medium">${config.text}</div>` : ''}
                    </div>
                `;
                    break;

                case 'dots':
                    content = `
                    <div class="flex flex-col items-center justify-center space-y-4">
                        <div class="flex items-center space-x-2">
                            <div class="dot w-2 h-2 bg-amber-500 rounded-full animate-bounce" style="animation-delay: 0ms;"></div>
                            <div class="dot w-2 h-2 bg-amber-500 rounded-full animate-bounce" style="animation-delay: 150ms;"></div>
                            <div class="dot w-2 h-2 bg-amber-500 rounded-full animate-bounce" style="animation-delay: 300ms;"></div>
                        </div>
                        ${config.text ? `<div class="text-gray-600 text-sm font-medium">${config.text}</div>` : ''}
                    </div>
                `;
                    break;

                case 'wave':
                    content = `
                    <div class="flex flex-col items-center justify-center space-y-4">
                        <div class="flex items-center space-x-1">
                            <div class="wave-bar w-1 h-8 bg-amber-500 rounded-full animate-wave" style="animation-delay: 0ms;"></div>
                            <div class="wave-bar w-1 h-8 bg-amber-500 rounded-full animate-wave" style="animation-delay: 100ms;"></div>
                            <div class="wave-bar w-1 h-8 bg-amber-500 rounded-full animate-wave" style="animation-delay: 200ms;"></div>
                            <div class="wave-bar w-1 h-8 bg-amber-500 rounded-full animate-wave" style="animation-delay: 300ms;"></div>
                            <div class="wave-bar w-1 h-8 bg-amber-500 rounded-full animate-wave" style="animation-delay: 400ms;"></div>
                        </div>
                        ${config.text ? `<div class="text-gray-600 text-sm font-medium">${config.text}</div>` : ''}
                    </div>
                `;
                    break;

                case 'progress':
                    content = `
                    <div class="w-full max-w-xs">
                        <div class="bg-gray-200 rounded-full h-2 overflow-hidden mb-2">
                            <div class="progress-bar bg-gradient-to-r from-amber-400 to-amber-600 h-full rounded-full transition-all duration-300" style="width: 0%;"></div>
                        </div>
                        <div class="flex justify-between text-xs text-gray-500">
                            <span>${config.text}</span>
                            <span class="progress-percentage">0%</span>
                        </div>
                    </div>
                `;
                    break;

                case 'skeleton':
                    content = this.createSkeletonContent(config.skeletonType || 'card');
                    break;

                default:
                    content = `
                    <div class="flex items-center justify-center">
                        <div class="spinner-circle w-6 h-6 border-2 border-gray-300 border-t-amber-500 rounded-full animate-spin"></div>
                    </div>
                `;
            }

            loader.innerHTML = content;
            return loader;
        }

        // Crear contenido skeleton
        createSkeletonContent(type) {
            switch (type) {
                case 'card':
                    return `
                    <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-6 animate-pulse">
                        <div class="flex items-center space-x-4 mb-4">
                            <div class="skeleton-avatar w-12 h-12 bg-gray-300 rounded-full"></div>
                            <div class="flex-1 space-y-2">
                                <div class="skeleton-line h-4 bg-gray-300 rounded w-3/4"></div>
                                <div class="skeleton-line h-3 bg-gray-300 rounded w-1/2"></div>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <div class="skeleton-line h-3 bg-gray-300 rounded"></div>
                            <div class="skeleton-line h-3 bg-gray-300 rounded w-5/6"></div>
                        </div>
                    </div>
                `;

                case 'table':
                    return `
                    <div class="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden animate-pulse">
                        <div class="bg-gray-50 p-4 border-b border-gray-200">
                            <div class="flex justify-between">
                                <div class="skeleton-line h-6 bg-gray-300 rounded w-1/4"></div>
                                <div class="skeleton-line h-6 bg-gray-300 rounded w-32"></div>
                            </div>
                        </div>
                        <div class="divide-y divide-gray-200">
                            ${Array(3).fill(0).map(() => `
                                <div class="p-4 flex items-center space-x-4">
                                    <div class="skeleton-avatar w-10 h-10 bg-gray-300 rounded-full"></div>
                                    <div class="flex-1 grid grid-cols-4 gap-4">
                                        <div class="skeleton-line h-4 bg-gray-300 rounded"></div>
                                        <div class="skeleton-line h-4 bg-gray-300 rounded"></div>
                                        <div class="skeleton-line h-4 bg-gray-300 rounded w-3/4"></div>
                                        <div class="skeleton-line h-4 bg-gray-300 rounded w-1/2"></div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;

                case 'list':
                    return `
                    <div class="space-y-3 animate-pulse">
                        ${Array(5).fill(0).map(() => `
                            <div class="flex items-center space-x-3 p-3 bg-white rounded-lg border border-gray-200">
                                <div class="skeleton-avatar w-8 h-8 bg-gray-300 rounded-full"></div>
                                <div class="flex-1 space-y-1">
                                    <div class="skeleton-line h-4 bg-gray-300 rounded w-3/4"></div>
                                    <div class="skeleton-line h-3 bg-gray-300 rounded w-1/2"></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;

                default:
                    return this.createSkeletonContent('card');
            }
        }

        // Mostrar loader overlay
        showOverlayLoader(target, loader, config) {
            const overlay = document.createElement('div');
            overlay.className = 'loader-overlay absolute inset-0 bg-white bg-opacity-75 flex items-center justify-center z-10';
            overlay.appendChild(loader);

            // Asegurar posición relativa en el target
            const position = window.getComputedStyle(target).position;
            if (position === 'static') {
                target.style.position = 'relative';
            }

            target.appendChild(overlay);
        }

        // Mostrar loader inline
        showInlineLoader(target, loader, config) {
            // Ocultar contenido original
            const originalContent = target.innerHTML;
            target.dataset.originalContent = originalContent;

            target.innerHTML = '';
            target.appendChild(loader);
        }

        // Ocultar loader
        hide(loaderId) {
            const loader = document.querySelector(`[data-loader-id="${loaderId}"]`);
            if (!loader) return;

            const overlay = loader.closest('.loader-overlay');
            if (overlay) {
                // Es un overlay
                overlay.remove();
            } else {
                // Es inline, restaurar contenido original
                const target = loader.parentElement;
                if (target && target.dataset.originalContent) {
                    target.innerHTML = target.dataset.originalContent;
                    delete target.dataset.originalContent;
                }
            }

            this.activeLoaders.delete(loaderId);
        }

        // Ocultar todos los loaders
        hideAll() {
            this.activeLoaders.forEach(loaderId => {
                this.hide(loaderId);
            });
        }

        // Actualizar progreso
        updateProgress(loaderId, percentage) {
            const loader = document.querySelector(`[data-loader-id="${loaderId}"]`);
            if (!loader) return;

            const progressBar = loader.querySelector('.progress-bar');
            const progressText = loader.querySelector('.progress-percentage');

            if (progressBar) {
                progressBar.style.width = `${percentage}%`;
            }
            if (progressText) {
                progressText.textContent = `${Math.round(percentage)}%`;
            }
        }

        // Mostrar loader de pantalla completa
        showFullscreen(text = 'Cargando TecnoTaller...') {
            if (this.fullscreenLoader) {
                this.fullscreenLoader.querySelector('h3').textContent = text;
                this.fullscreenLoader.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
            }
        }

        // Ocultar loader de pantalla completa
        hideFullscreen() {
            if (this.fullscreenLoader) {
                this.fullscreenLoader.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }
        }

        // Actualizar progreso de pantalla completa
        updateFullscreenProgress(percentage, text = null) {
            if (this.fullscreenProgress) {
                this.fullscreenProgress.style.width = `${percentage}%`;
            }
            if (this.fullscreenPercentage) {
                this.fullscreenPercentage.textContent = `${Math.round(percentage)}%`;
            }
            if (text) {
                const statusText = this.fullscreenLoader?.querySelector('p');
                if (statusText) {
                    statusText.textContent = text;
                }
            }
        }

        // Estados de botón
        setButtonLoading(button, loading = true, text = null) {
            if (typeof button === 'string') {
                button = document.querySelector(button);
            }

            if (!button) return;

            if (loading) {
                button.dataset.originalText = button.textContent;
                button.disabled = true;
                button.classList.add('opacity-75', 'cursor-not-allowed');

                const loadingContent = `
                <div class="flex items-center space-x-2">
                    <div class="w-4 h-4 border-2 border-current border-t-transparent rounded-full animate-spin"></div>
                    <span>${text || 'Cargando...'}</span>
                </div>
            `;
                button.innerHTML = loadingContent;
            } else {
                button.disabled = false;
                button.classList.remove('opacity-75', 'cursor-not-allowed');
                button.textContent = button.dataset.originalText || 'Continuar';
                delete button.dataset.originalText;
            }
        }

        // Mostrar skeleton para elemento
        showSkeleton(target, type = 'card') {
            return this.show(target, {
                type: 'skeleton',
                skeletonType: type,
                overlay: false
            });
        }

        // Generar ID único
        generateId() {
            return `loader_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
        }

        // Verificar si un loader está activo
        isActive(loaderId) {
            return this.activeLoaders.has(loaderId);
        }

        // Obtener lista de loaders activos
        getActiveLoaders() {
            return Array.from(this.activeLoaders);
        }
    }

        window.loadersAPI = new LoadersAPI();
