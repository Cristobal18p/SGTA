<style>
    .sidebar {
        width: 280px;
        transform: translateX(-100%);
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .sidebar.collapsed {
        width: 80px;
    }

    .sidebar.collapsed .sidebar-text {
        display: none;
    }

    .sidebar.collapsed .sidebar-section h3 {
        display: none;
    }

    .logo-circle {
        background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
    }

    .sidebar-link.active {
        background: rgba(245, 158, 11, 0.2);
        border-left: 4px solid #f59e0b;
    }

    .sidebar-link.active i {
        color: #fbbf24 !important;
    }

    @media (min-width: 1024px) {
        .sidebar {
            transform: translateX(0);
        }

        .sidebar-toggle-btn {
            display: none;
        }
    }

    /* Animaciones */
    .sidebar-link {
        position: relative;
        overflow: hidden;
    }

    .sidebar-link::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, rgba(245, 158, 11, 0.1) 0%, transparent 100%);
        transition: width 0.3s ease;
    }

    .sidebar-link:hover::before {
        width: 100%;
    }
</style>

<script>
    // ============================================
    // SIDEBAR API
    // ============================================
    class SidebarAPI {
        constructor() {
            this.sidebar = document.getElementById('sidebar');
            this.overlay = document.getElementById('sidebarOverlay');
            this.toggleBtn = document.getElementById('sidebarToggleBtn');
            this.closeBtn = document.getElementById('sidebarToggle');
            this.collapsed = false;

            this.initializeEvents();
            this.setActivePage();
            this.handleResize();
        }

        // Inicializar eventos
        initializeEvents() {
            // Toggle sidebar en móvil
            this.toggleBtn?.addEventListener('click', () => {
                this.toggle();
            });

            // Cerrar sidebar
            this.closeBtn?.addEventListener('click', () => {
                this.close();
            });

            // Cerrar con overlay
            this.overlay?.addEventListener('click', () => {
                this.close();
            });

            // Manejar redimensionado de ventana
            window.addEventListener('resize', () => {
                this.handleResize();
            });

            // Tecla ESC para cerrar
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && this.isOpen()) {
                    this.close();
                }
            });
        }

        // Abrir sidebar
        open() {
            this.sidebar?.classList.add('open');
            this.overlay?.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // Cerrar sidebar
        close() {
            this.sidebar?.classList.remove('open');
            this.overlay?.classList.add('hidden');
            document.body.style.overflow = '';
        }

        // Toggle sidebar
        toggle() {
            if (this.isOpen()) {
                this.close();
            } else {
                this.open();
            }
        }

        // Verificar si está abierto
        isOpen() {
            return this.sidebar?.classList.contains('open') || window.innerWidth >= 1024;
        }

        // Colapsar/expandir sidebar (solo desktop)
        toggleCollapse() {
            if (window.innerWidth >= 1024) {
                this.collapsed = !this.collapsed;
                if (this.collapsed) {
                    this.sidebar?.classList.add('collapsed');
                } else {
                    this.sidebar?.classList.remove('collapsed');
                }
                localStorage.setItem('sidebarCollapsed', this.collapsed);
            }
        }

        // Manejar redimensionado
        handleResize() {
            if (window.innerWidth >= 1024) {
                this.close();
                this.sidebar?.classList.add('open');

                // Restaurar estado colapsado
                const savedCollapsed = localStorage.getItem('sidebarCollapsed');
                if (savedCollapsed === 'true') {
                    this.collapsed = true;
                    this.sidebar?.classList.add('collapsed');
                }
            } else {
                this.sidebar?.classList.remove('open', 'collapsed');
                this.collapsed = false;
            }
        }

        // Marcar página activa
        setActivePage() {
            const currentPage = window.location.pathname.split('/').pop();
            const links = document.querySelectorAll('.sidebar-link');

            links.forEach(link => {
                link.classList.remove('active');
                const href = link.getAttribute('href');
                if (href && href.includes(currentPage)) {
                    link.classList.add('active');
                }
            });
        }

        // Actualizar badge de notificaciones
        updateNotificationBadge(page, count) {
            const link = document.querySelector(`a[href*="${page}"]`);
            if (link) {
                let badge = link.querySelector('.bg-red-500');
                if (count > 0) {
                    if (!badge) {
                        badge = document.createElement('span');
                        badge.className = 'sidebar-text bg-red-500 text-xs px-2 py-1 rounded-full ml-auto';
                        link.appendChild(badge);
                    }
                    badge.textContent = count > 99 ? '99+' : count;
                } else if (badge) {
                    badge.remove();
                }
            }
        }

        // Destacar página con animación
        highlightPage(page) {
            const link = document.querySelector(`a[href*="${page}"]`);
            if (link) {
                link.style.animation = 'pulse 2s ease-in-out';
                setTimeout(() => {
                    link.style.animation = '';
                }, 2000);
            }
        }
    }

    // Inicializar sidebar cuando se carga el DOM
    document.addEventListener('DOMContentLoaded', () => {
        window.sidebarAPI = new SidebarAPI();
    });
</script>
