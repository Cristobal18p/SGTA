<style>
    /* Importar tema elegante */
    @import url('../css/dark-mode.css');

    .logo-circle {
        background: linear-gradient(135deg, var(--primary-brand, #1a365d) 0%, var(--primary-brand-light, #2d5a87) 100%);
        box-shadow: 0 4px 20px rgba(26, 54, 93, 0.15);
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 1rem;
        transition: all 0.2s ease-in-out;
    }

    .logo-circle:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 24px rgba(26, 54, 93, 0.25);
    }

    .dark .logo-circle {
        background: linear-gradient(135deg, var(--accent-steel, #4a5568) 0%, var(--accent-steel-light, #718096) 100%);
        box-shadow: 0 4px 20px rgba(74, 85, 104, 0.25);
    }

    .dark .logo-circle:hover {
        box-shadow: 0 6px 24px rgba(74, 85, 104, 0.35);
    }

    .nav-link.active {
        background: linear-gradient(135deg, var(--primary-brand, #1a365d), var(--primary-brand-light, #2d5a87));
        color: white;
        box-shadow: 0 2px 8px rgba(26, 54, 93, 0.15);
    }

    .dark .nav-link.active {
        background: linear-gradient(135deg, var(--accent-steel, #4a5568), var(--accent-steel-light, #718096));
    }

    /* Efectos hover elegantes */
    .transition-colors {
        transition: color 0.2s ease-in-out, background-color 0.2s ease-in-out, transform 0.2s ease-in-out;
    }

    button:hover {
        transform: translateY(-1px);
    }

    /* Navbar con efecto glassmorphism */
    .tt-navbar {
        backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.95);
    }

    .dark .tt-navbar {
        background: rgba(17, 24, 39, 0.95);
    }
</style>

<script>
    // Navbar API
    class NavbarAPI {
        constructor() {
            this.initializeEvents();
            this.loadUserData();
        }

        // Inicializar eventos
        initializeEvents() {
            // Toggle menú de usuario
            document.getElementById('userMenuBtn')?.addEventListener('click', () => {
                this.toggleUserDropdown();
            });

            // Toggle menú móvil
            document.getElementById('mobileMenuBtn')?.addEventListener('click', () => {
                this.toggleMobileMenu();
            });

            // Cerrar dropdowns al hacer click fuera
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#userMenuBtn') && !e.target.closest('#userDropdown')) {
                    this.closeUserDropdown();
                }
            });

            // Logout
            document.getElementById('logoutBtn')?.addEventListener('click', () => {
                this.logout();
            });

            // Marcar página activa
            this.setActivePage();
        }

        // Cargar datos del usuario
        loadUserData() {
            const userData = localStorage.getItem('userData');
            if (userData) {
                try {
                    const user = JSON.parse(userData);
                    console.log('Datos del usuario cargados:', user);

                    // Construir nombre completo
                    const nombreCompleto = `${user.primer_nombre || ''} ${user.segundo_nombre || ''} ${user.primer_apellido || ''} ${user.segundo_apellido || ''}`.trim();
                    const nombreMostrar = nombreCompleto || 'Usuario';
                    const rolMostrar = user.rol_nombre || user.rol || 'Usuario';
                    const emailMostrar = user.email || user.correo || '';

                    // Actualizar elementos del navbar principal
                    const userFullNameElement = document.getElementById('userFullName');
                    const userRoleElement = document.getElementById('userRole');

                    if (userFullNameElement) {
                        userFullNameElement.textContent = nombreMostrar;
                    }
                    if (userRoleElement) {
                        userRoleElement.textContent = rolMostrar;
                    }

                    // Actualizar elementos del dropdown
                    const dropdownUserName = document.getElementById('dropdownUserName');
                    const dropdownUserRole = document.getElementById('dropdownUserRole');
                    const dropdownUserEmail = document.getElementById('dropdownUserEmail');

                    if (dropdownUserName) {
                        dropdownUserName.textContent = nombreMostrar;
                    }
                    if (dropdownUserRole) {
                        dropdownUserRole.textContent = rolMostrar;
                    }
                    if (dropdownUserEmail) {
                        dropdownUserEmail.textContent = emailMostrar;
                    }

                } catch (error) {
                    console.error('Error al cargar datos del usuario:', error);
                    // Mostrar valores por defecto en caso de error
                    this.setDefaultUserData();
                }
            } else {
                console.warn('No hay datos de usuario en localStorage');
                this.setDefaultUserData();
            }
        }

        // Establecer datos de usuario por defecto
        setDefaultUserData() {
            const elements = [
                { id: 'userFullName', defaultText: 'Usuario' },
                { id: 'userRole', defaultText: 'Sin rol asignado' },
                { id: 'dropdownUserName', defaultText: 'Usuario' },
                { id: 'dropdownUserRole', defaultText: 'Sin rol asignado' },
                { id: 'dropdownUserEmail', defaultText: 'No disponible' }
            ];

            elements.forEach(element => {
                const el = document.getElementById(element.id);
                if (el) {
                    el.textContent = element.defaultText;
                }
            });
        }

        // Toggle menú de usuario
        toggleUserDropdown() {
            const dropdown = document.getElementById('userDropdown');
            dropdown?.classList.toggle('hidden');
        }

        // Cerrar menú de usuario
        closeUserDropdown() {
            const dropdown = document.getElementById('userDropdown');
            dropdown?.classList.add('hidden');
        }

        // Toggle menú móvil
        toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu?.classList.toggle('hidden');
        }

        // Marcar página activa
        setActivePage() {
            const currentPage = window.location.pathname.split('/').pop();
            const links = document.querySelectorAll('.nav-link');

            links.forEach(link => {
                const href = link.getAttribute('href');
                if (href && href.includes(currentPage)) {
                    link.classList.add('active');
                }
            });
        }

        // Mostrar/ocultar badge de notificaciones
        setNotificationCount(count) {
            const badge = document.getElementById('notificationsBadge');
            if (badge) {
                if (count > 0) {
                    badge.textContent = count > 99 ? '99+' : count;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }
            }
        }

        // Cerrar sesión
        logout() {
            if (confirm('¿Estás seguro de que quieres cerrar sesión?')) {
                localStorage.removeItem('authToken');
                localStorage.removeItem('loginTime');
                localStorage.removeItem('userData');
                window.location.href = './index.html';
            }
        }
    }

    // Inicializar navbar cuando se carga el DOM
    document.addEventListener('DOMContentLoaded', () => {
        window.navbarAPI = new NavbarAPI();
    });
</script>
